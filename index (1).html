<style>
:root{--bg:#fff5f8;--card:#ffffff;--text:#4a2c3f;--muted:#9a7b8c;--brand:#e8789f;--brand2:#b79ced;--peach:#ffd9cc;--line:#f6dbe8;--r:22px;
--grad:linear-gradient(135deg,#f58fb0,#b79ced);--soft:linear-gradient(135deg,#ffdbe9,#e6d9ff);
--shadow:0 8px 26px rgba(232,120,159,.13);color-scheme:light}
:root[data-theme=dark]{--bg:#1d1422;--card:#2a1d33;--text:#fbeaf3;--muted:#c3a6b8;--brand:#f58fb0;--brand2:#b79ced;--line:#4a3358;
--soft:linear-gradient(135deg,#4a2a45,#37285a);--shadow:0 8px 26px rgba(0,0,0,.28);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Hind Siliguri",system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:var(--text);line-height:1.65;min-height:100vh;
background:radial-gradient(900px 520px at 8% -8%,#ffe0ed 0,transparent 60%),radial-gradient(800px 520px at 100% 0,#e8ddff 0,transparent 55%),var(--bg);background-attachment:fixed}
:root[data-theme=dark] body{background:radial-gradient(900px 520px at 8% -8%,#3a2040 0,transparent 60%),radial-gradient(800px 520px at 100% 0,#2b2250 0,transparent 55%),var(--bg);background-attachment:fixed}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
a{color:var(--brand)}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.5rem;padding:.55rem 0}
.logo{font-family:"Galada","Hind Siliguri",cursive;font-weight:400;font-size:1.35rem;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none;flex:1}
.ib{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:.4rem .85rem;transition:transform .15s,box-shadow .15s,border-color .15s}
.ib:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(232,120,159,.2)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:999px;padding:.5rem 1.15rem;font-weight:600;box-shadow:0 6px 16px rgba(232,120,159,.3);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.hero{padding:2rem 0 .8rem;text-align:center;position:relative}
.hero::before{content:"✿ ♡ ✿";display:block;color:var(--brand2);letter-spacing:.6rem;font-size:1rem;opacity:.8}
.hero h1{margin:.3rem 0;font-family:"Galada","Hind Siliguri",cursive;font-weight:400;font-size:clamp(1.9rem,7vw,3rem);line-height:1.3;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:.2rem 0 1.2rem}
.sbox{position:relative;max-width:660px;margin:0 auto}
.sbox input{width:100%;padding:.9rem 5.5rem .9rem 1.3rem;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:1rem;box-shadow:var(--shadow)}
.sbox input:focus{outline:none;border-color:var(--brand)}
.sbox .x,.sbox .mic{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.1rem;color:var(--muted)}
.sbox .x{right:2.8rem}.sbox .mic{right:1rem}
#sugg{position:absolute;left:0;right:0;top:112%;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:left;z-index:10;overflow:hidden;box-shadow:var(--shadow)}
#sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:.65rem 1.1rem;color:var(--text)}
#sugg button:hover,#sugg button:focus{background:var(--bg)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.9rem 0;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:.32rem 1rem}
.chip[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(232,120,159,.3)}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.3rem 0 1rem}
select{padding:.42rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
section{margin:1.6rem 0}h2{font-size:1.25rem;margin:.2rem 0 .8rem}
.daily{background:var(--soft);color:var(--text);border-radius:var(--r);padding:1.4rem 1.3rem;position:relative;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.daily::after{content:"”";position:absolute;right:.8rem;top:-1.2rem;font-size:7rem;color:var(--brand);opacity:.18;font-family:Georgia,serif;line-height:1}
.daily strong{color:var(--brand)}
.daily blockquote{margin:.5rem 0 .9rem;font-size:1.25rem;line-height:1.7;white-space:pre-line}
.daily .btn{background:var(--card);color:var(--brand);box-shadow:none;border:1px solid var(--line)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.7rem;transition:transform .2s,box-shadow .2s;position:relative}
.card::before{content:"";position:absolute;left:1.15rem;right:1.15rem;top:0;height:3px;border-radius:0 0 6px 6px;background:var(--grad);opacity:.7}
.card:hover{transform:translateY(-3px)}
.card p{margin:.3rem 0 0;white-space:pre-line;flex:1;font-size:1.05rem}
.meta{font-size:.8rem;color:var(--muted);display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.tag{background:var(--soft);border-radius:999px;padding:0 .6rem;color:var(--text)}
.acts{display:flex;gap:.4rem;flex-wrap:wrap}.acts button{flex:1;min-width:60px;font-size:.85rem}
.fav[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent}
.empty,.err{text-align:center;color:var(--muted);padding:2rem 1rem;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--card)}
.skel{height:140px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--text);max-width:92vw;width:400px;padding:1.3rem;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(74,44,63,.45);backdrop-filter:blur(3px)}
dialog input,dialog textarea{width:100%;padding:.65rem .8rem;margin:.3rem 0;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:.6rem 1.1rem;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);margin-top:2.5rem;padding:1.6rem 0 6rem;text-align:center;color:var(--muted);font-size:.9rem}
.social{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:.7rem}
.social a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .9rem}
nav.bottom{display:none}
@media(max-width:700px){nav.bottom{display:flex;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;z-index:30;box-shadow:var(--shadow);padding:.15rem}
nav.bottom a,nav.bottom button{flex:1;text-align:center;padding:.5rem 0;font-size:.78rem;text-decoration:none;color:var(--text);background:none;border:0;line-height:1.3}}
a.ib{text-decoration:none;display:inline-block}
.logo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:480px){.logo{font-size:1.1rem}.bar{gap:.35rem}.ib{padding:.35rem .65rem}}
.logo{display:flex;align-items:center;gap:.55rem;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit;-webkit-text-fill-color:initial}
.logo img{width:36px;height:36px;border-radius:50%;flex:none;box-shadow:0 2px 10px rgba(74,44,63,.25)}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media(max-width:480px){.logo img{width:32px;height:32px}}
@media(max-width:480px){.hd{display:none}.logo span{font-size:1rem}}

</style>

<script>
// Part 05: Bangla/English typo-tolerant search using Fuse.js.
// Load BEFORE this file:
//   the Fuse.js 7.0.0 script from jsdelivr (see index.html)
// Usage:
//   const engine = CaptionSearch.create(items); // items: [{id,title,body,category,tags:[...]}]
//   const results = engine.search('valobashar caption');
//   const onType = CaptionSearch.debounce(q => render(engine.search(q)), 250);
(function (global) {
  // Normalize Bangla variants so ভালবাসা ~ ভালোবাসা
  function normalize(s) {
    return (s || '').toString().normalize('NFC').toLowerCase()
      .replace(/\u09CB/g, '')
      .replace(/[^\p{L}\p{N}\p{M}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
  }
  // Roman-Bangla bridge (extend freely)
  const ROMAN = { valobas:'ভালোবাসা', bhalobas:'ভালোবাসা', prem:'প্রেম', kosto:'কষ্ট',
    bondhu:'বন্ধুত্ব', sad:'কষ্ট', love:'ভালোবাসা', romantic:'রোমান্টিক', attitude:'অ্যাটিটিউড' };
  function expand(q) {
    const words = normalize(q).split(' ').filter(Boolean);
    const extra = [];
    words.forEach(w => { for (const k in ROMAN) if (w.startsWith(k)) extra.push(normalize(ROMAN[k])); });
    return [...new Set([...words, ...extra])].join(' ');
  }
  function create(items) {
    const data = items.map(i => ({ ...i, _t: normalize(i.title), _b: normalize(i.body),
      _g: (i.tags || []).map(normalize).join(' '), _c: normalize(i.category) }));
    // Fallback if the Fuse.js CDN is unreachable: simple substring matching so the site never breaks
    const fuse = global.Fuse ? new global.Fuse(data, {
      threshold: 0.35, ignoreLocation: true, minMatchCharLength: 2,
      keys: [{ name: '_t', weight: 3 }, { name: '_g', weight: 2 }, { name: '_c', weight: 2 }, { name: '_b', weight: 1 }]
    }) : {
      search(q, o) {
        const ws = q.split(' ').filter(Boolean);
        return data.map((i) => ({ item: i, sc: ws.filter((w) => (i._t + ' ' + i._g + ' ' + i._c + ' ' + i._b).includes(w)).length })).filter((x) => x.sc).sort((a, b) => b.sc - a.sc).slice(0, (o && o.limit) || 30);
      }
    };
    const cache = new Map();
    return {
      search(q, limit = 30) {
        const key = normalize(q); if (!key) return [];
        if (cache.has(key)) return cache.get(key);
        const out = fuse.search(expand(q), { limit }).map(r => r.item);
        cache.set(key, out); if (cache.size > 100) cache.delete(cache.keys().next().value);
        return out;
      }
    };
  }
  function debounce(fn, ms = 250) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  global.CaptionSearch = { create, debounce, normalize };
})(window);

</script>
<script>
(function () {
  "use strict";
  const cfg = window.SITE_CONFIG || {};
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const CATS = { love:"ভালোবাসা", sad:"কষ্ট", attitude:"অ্যাটিটিউড", friendship:"বন্ধুত্ব", islamic:"ইসলামিক", motivational:"অনুপ্রেরণা", funny:"মজার", life:"জীবন" };
  const TYPES = { caption:"ক্যাপশন", shayari:"শায়েরি", poem:"কবিতা", story:"গল্প" };
  const PAGE = 12;
  const BASE = location.origin + location.pathname.replace(/[^/]*$/, ""); // works under /Caption/ too
  const st = { items: [], q: "", cat: "", type: "", sort: "latest", favOnly: false, page: 1 };
  let sb = null, user = null, engine = null, favs = new Set(store.get("favs", []));
  let authMode = "login";

  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); };
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  // ---------- Theme ----------
  $("#themeBtn").onclick = () => {
    const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = n; try { localStorage.setItem("theme", n); } catch {}
  };

  // ---------- Data ----------
  async function load() {
    const list = $("#list"); list.replaceChildren(...Array.from({ length: 6 }, () => el("div", "skel")));
    if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      try {
        const { data, error } = await sb.from("contents").select("*").eq("status", "published").order("created_at", { ascending: false }).limit(500);
        if (error) throw error;
        st.items = data.map((r) => ({ ...r, tags: r.tags || [] }));
      } catch (e) {
        console.error(e);
        st.items = window.SAMPLE_ITEMS || [];
        toast("সার্ভার সংযোগ ব্যর্থ, নমুনা কনটেন্ট দেখানো হচ্ছে");
      }
      initAuth();
      sb.from("site_settings").select("value").eq("key", "social").maybeSingle().then(({ data }) => {
        if (data && Array.isArray(data.value) && data.value.length) renderSocial(data.value.filter((x) => x.enabled !== false).sort((a, b) => (a.order || 0) - (b.order || 0)));
      }, () => {});
    } else {
      st.items = window.SAMPLE_ITEMS || [];
      $("#authBtn").hidden = true; $("#nAuth").hidden = true;
    }
    engine = CaptionSearch.create(st.items.map((i) => ({ ...i, category: CATS[i.category] || i.category })));
    renderDaily(); renderCats(); render();
  }

  // ---------- Ranking ----------
  function trending(i) {
    const age = (Date.now() - new Date(i.created_at).getTime()) / 864e5;
    return ((i.views || 0) + (i.copies || 0) * 3 + (i.shares || 0) * 4 + (i.likes || 0) * 2) / (1 + age / 7);
  }
  function filtered() {
    let r = st.q ? engine.search(st.q, 100).map((x) => st.items.find((i) => i.id === x.id)).filter(Boolean) : st.items.slice();
    if (st.cat) r = r.filter((i) => i.category === st.cat);
    if (st.type) r = r.filter((i) => i.type === st.type);
    if (st.favOnly) r = r.filter((i) => favs.has(String(i.id)));
    if (!st.q) {
      const s = st.sort;
      r.sort((a, b) => s === "trending" ? trending(b) - trending(a) : s === "latest" ? new Date(b.created_at) - new Date(a.created_at) : (b[s] || 0) - (a[s] || 0));
    }
    return r;
  }

  // ---------- Render ----------
  function card(i) {
    const c = el("article", "card");
    c.appendChild(el("p", "", i.body));
    const m = el("div", "meta");
    m.appendChild(el("span", "tag", TYPES[i.type] || i.type));
    m.appendChild(el("span", "tag", CATS[i.category] || i.category));
    (i.tags || []).slice(0, 2).forEach((t) => m.appendChild(el("span", "tag", "#" + t)));
    m.appendChild(el("span", "", "👁 " + (i.views || 0) + " · 📋 " + (i.copies || 0)));
    c.appendChild(m);
    const a = el("div", "acts");
    const cp = el("button", "ib", "কপি"); cp.onclick = () => copy(i);
    const sh = el("button", "ib", "শেয়ার"); sh.onclick = () => share(i);
    const fv = el("button", "ib fav", "❤"); fv.setAttribute("aria-pressed", favs.has(String(i.id)));
    fv.setAttribute("aria-label", "পছন্দ"); fv.onclick = () => { toggleFav(i); fv.setAttribute("aria-pressed", favs.has(String(i.id))); };
    a.append(cp, sh, fv); c.appendChild(a);
    return c;
  }
  function render() {
    const r = filtered(), list = $("#list");
    $("#clr").hidden = !st.q;
    $("#rtitle").textContent = st.favOnly ? "আমার পছন্দ" : st.q ? `"${st.q}" এর ফলাফল (${r.length})` : "সব কনটেন্ট";
    list.replaceChildren();
    if (!r.length) {
      const e = el("div", "empty", st.favOnly ? "এখনো কিছু পছন্দ করা হয়নি।" : "কিছু পাওয়া যায়নি। অন্য শব্দ বা ক্যাটাগরি চেষ্টা করুন।");
      e.style.gridColumn = "1/-1"; list.appendChild(e); $("#more").hidden = true; return;
    }
    r.slice(0, st.page * PAGE).forEach((i) => list.appendChild(card(i)));
    $("#more").hidden = r.length <= st.page * PAGE;
  }
  function renderCats() {
    const box = $("#cats"); box.replaceChildren();
    [["", "সব"], ...Object.entries(CATS)].forEach(([k, v]) => {
      const b = el("button", "chip", v); b.setAttribute("aria-pressed", st.cat === k);
      b.onclick = () => { st.cat = k; st.page = 1; renderCats(); render(); }; box.appendChild(b);
    });
  }
  function renderDaily() {
    const pool = st.items.filter((i) => i.type === "caption" || i.type === "shayari");
    const box = $("#dailyBox"); if (!pool.length) { box.hidden = true; return; }
    const day = Math.floor(Date.now() / 864e5);
    const i = pool[day % pool.length];
    box.replaceChildren(el("strong", "", "✨ আজকের কোট"), el("blockquote", "", i.body));
    const row = el("div", "acts");
    const c = el("button", "btn", "কপি"); c.onclick = () => copy(i);
    const s = el("button", "btn", "শেয়ার"); s.onclick = () => share(i);
    row.append(c, s); box.appendChild(row);
  }

  // ---------- Actions ----------
  const bump = (i, f) => { i[f] = (i[f] || 0) + 1; if (sb && !String(i.id).startsWith("s")) sb.rpc("bump_stat", { p_id: i.id, p_field: f }).then(() => {}, () => {}); };
  async function writeClip(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch {} t.remove(); return ok;
    }
  }
  async function copy(i) { (await writeClip(i.body)) ? (toast("কপি হয়েছে ✓"), bump(i, "copies")) : toast("কপি করা যায়নি"); }
  function toggleFav(i) {
    const id = String(i.id);
    if (favs.has(id)) favs.delete(id); else { favs.add(id); bump(i, "likes"); }
    store.set("favs", [...favs]);
    if (sb && user && !id.startsWith("s")) {
      const q = favs.has(id) ? sb.from("favorites").upsert({ user_id: user.id, content_id: i.id }) : sb.from("favorites").delete().eq("user_id", user.id).eq("content_id", i.id);
      q.then(() => {}, () => {});
    }
    if (st.favOnly) render();
  }
  function share(i) {
    const url = BASE;
    const text = `এই সুন্দর লেখাটি দেখুন —\n${i.body}`;
    $("#shareText").value = text;
    const enc = encodeURIComponent, links = $("#shareLinks"); links.replaceChildren();
    const mk = (n, h) => { const a = el("a", "btn alt", n); a.href = h; a.target = "_blank"; a.rel = "noopener noreferrer"; links.appendChild(a); a.onclick = () => bump(i, "shares"); };
    mk("WhatsApp", "https://wa.me/?text=" + enc(text + "\n" + url));
    mk("Facebook", "https://www.facebook.com/sharer/sharer.php?u=" + enc(url) + "&quote=" + enc(text));
    mk("Telegram", "https://t.me/share/url?url=" + enc(url) + "&text=" + enc(text));
    mk("X", "https://twitter.com/intent/tweet?text=" + enc(text) + "&url=" + enc(url));
    if (navigator.share) { navigator.share({ text, url }).then(() => bump(i, "shares")).catch(() => $("#shareDlg").showModal()); } else $("#shareDlg").showModal();
  }
  $("#shareCopy").onclick = async () => { (await writeClip($("#shareText").value)) ? toast("কপি হয়েছে ✓") : toast("কপি ব্যর্থ"); };
  $("#shareClose").onclick = () => $("#shareDlg").close();

  // ---------- Search UI ----------
  const onType = CaptionSearch.debounce(() => { st.q = $("#q").value.trim(); st.page = 1; render(); suggest(); }, 250);
  $("#q").addEventListener("input", onType);
  $("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { saveRecent(st.q); $("#sugg").hidden = true; } if (e.key === "Escape") $("#sugg").hidden = true; });
  $("#clr").onclick = () => { $("#q").value = ""; st.q = ""; $("#sugg").hidden = true; render(); $("#q").focus(); };
  $("#q").addEventListener("focus", suggest);
  document.addEventListener("click", (e) => { if (!e.target.closest(".sbox")) $("#sugg").hidden = true; });
  function saveRecent(q) { if (!q) return; const r = [q, ...store.get("recent", []).filter((x) => x !== q)].slice(0, 6); store.set("recent", r); }
  function suggest() {
    const box = $("#sugg"), q = $("#q").value.trim(); box.replaceChildren();
    const opts = q ? engine.search(q, 4).map((i) => i.body.split("\n")[0].slice(0, 40)) : store.get("recent", []);
    if (!opts.length) { box.hidden = true; return; }
    opts.forEach((o) => { const b = el("button", "", (q ? "🔍 " : "🕘 ") + o); b.onclick = () => { $("#q").value = o; st.q = o; saveRecent(o); box.hidden = true; render(); }; box.appendChild(b); });
    box.hidden = false;
  }
  // Voice search (only where the browser supports it; browser asks mic permission)
  $("#mic").onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast("এই ব্রাউজারে ভয়েস সার্চ সমর্থিত নয়");
    const r = new SR(); r.lang = "bn-BD"; r.interimResults = false;
    r.onresult = (e) => { $("#q").value = e.results[0][0].transcript; onType(); };
    r.onerror = () => toast("ভয়েস ইনপুট ব্যর্থ বা অনুমতি দেওয়া হয়নি");
    try { r.start(); toast("বলুন…"); } catch {}
  };
  $("#type").onchange = (e) => { st.type = e.target.value; st.page = 1; render(); };
  $("#sort").onchange = (e) => { st.sort = e.target.value; st.page = 1; render(); };
  $("#more").onclick = () => { st.page++; render(); };
  $("#fav").onclick = $("#nFav").onclick = () => { st.favOnly = !st.favOnly; $("#fav").setAttribute("aria-pressed", st.favOnly); st.page = 1; render(); location.hash = "top"; };
  $("#nSearch").onclick = () => { scrollTo({ top: 0 }); $("#q").focus(); };
  $("#rnd").onclick = () => { const r = st.items; if (!r.length) return; const i = r[Math.floor(Math.random() * r.length)]; st.q = ""; $("#q").value = ""; $("#list").replaceChildren(card(i)); $("#rtitle").textContent = "র‍্যান্ডম কনটেন্ট"; $("#more").hidden = true; bump(i, "views"); };

  // ---------- Auth (Supabase) ----------
  function initAuth() {
    sb.auth.getSession().then(({ data }) => setUser(data.session && data.session.user));
    sb.auth.onAuthStateChange((_e, s) => setUser(s && s.user));
  }
  async function setUser(u) {
    user = u || null;
    $("#authBtn").textContent = user ? "লগআউট" : "লগইন";
    if (user && sb) {
      try {
        const { data } = await sb.from("favorites").select("content_id").eq("user_id", user.id);
        if (data) { data.forEach((r) => favs.add(String(r.content_id))); store.set("favs", [...favs]); render(); }
      } catch {}
    }
  }
  const openAuth = () => { if (user) { sb.auth.signOut(); toast("লগআউট হয়েছে"); } else $("#authDlg").showModal(); };
  $("#authBtn").onclick = $("#nAuth").onclick = openAuth;
  $("#authClose").onclick = () => $("#authDlg").close();
  $("#authSwitch").onclick = () => {
    authMode = authMode === "login" ? "signup" : "login";
    $("#authTitle").textContent = authMode === "login" ? "লগইন" : "নতুন অ্যাকাউন্ট";
    $("#authGo").textContent = authMode === "login" ? "লগইন" : "রেজিস্টার";
    $("#authSwitch").textContent = authMode === "login" ? "নতুন অ্যাকাউন্ট" : "লগইনে ফিরুন";
  };
  $("#authGo").onclick = async () => {
    const email = $("#em").value.trim(), password = $("#pw").value, msg = $("#authMsg");
    if (!email || password.length < 8) return (msg.textContent = "সঠিক ইমেইল ও কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।");
    msg.textContent = "অপেক্ষা করুন…";
    const { error } = authMode === "login" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password, options: { emailRedirectTo: BASE } });
    if (error) msg.textContent = "ব্যর্থ: " + error.message;
    else if (authMode === "signup") msg.textContent = "ইমেইল ভেরিফিকেশন লিংক পাঠানো হয়েছে। ইনবক্স চেক করুন।";
    else { msg.textContent = ""; $("#authDlg").close(); toast("লগইন সফল ✓"); }
  };
  $("#gBtn").onclick = () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: BASE } });
  $("#forgot").onclick = async () => {
    const email = $("#em").value.trim(); if (!email) return ($("#authMsg").textContent = "প্রথমে ইমেইল লিখুন।");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: BASE });
    $("#authMsg").textContent = error ? "ব্যর্থ: " + error.message : "রিসেট লিংক পাঠানো হয়েছে।";
  };

  // ---------- Social links (admin-managed, with config fallback; only valid https URLs) ----------
  const names = { facebook: "Facebook", youtube: "YouTube", instagram: "Instagram", tiktok: "TikTok", telegram: "Telegram", whatsapp: "WhatsApp", pinterest: "Pinterest", x: "X" };
  function renderSocial(items) {
    const box = $("#social"); box.replaceChildren();
    items.forEach(({ name, url }) => {
      try { const u = new URL(url); if (u.protocol !== "https:") return;
        const a = el("a", "", name); a.href = u.href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.setAttribute("aria-label", name + " এ যান"); box.appendChild(a);
      } catch {}
    });
  }
  renderSocial(Object.entries(cfg.SOCIAL || {}).filter(([, u]) => u).map(([k, u]) => ({ name: names[k] || k, url: u })));

  $("#yr").textContent = new Date().getFullYear();
  load();
})();

</script>
</body></html>
